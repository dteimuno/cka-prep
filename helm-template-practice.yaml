apiVersion: v1
kind: Namespace
metadata:
  name: hardcoded-ns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: app-sa
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","sleep 3600"]
